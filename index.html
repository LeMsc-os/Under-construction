<title>BloFin MTF Analyzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one phone-width terminal column. Header, mode switch, tabs, then panels. Single dark look. */
  :root{
    --bg:#04080f; --panel:#09121d; --panel2:#0d1a29; --line:#15293e;
    --fg:#d5e5f6; --mut:#7692ae; --dim:#46617d;
    --acc:#00ffcc; --up:#00d4a0; --dn:#ff4d6d; --warn:#f0b429;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    color-scheme:dark;
  }
  html,body{background:var(--bg)}
  body{margin:0;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
  .wrap{max-width:480px;margin-inline:auto;padding-inline:16px;padding-block:14px}
  #app{min-width:0}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .dn{color:var(--dn)} .warn{color:var(--warn)} .mut{color:var(--mut)} .acc{color:var(--acc)}
  button{font-family:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation}
  button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

  .hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px}
  .seggrp{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:12px;padding:7px 12px;border-radius:6px;cursor:pointer;min-height:34px}
  .seg.on{background:var(--acc);color:#03130f}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;border:1px solid currentColor;margin-left:8px;vertical-align:middle}
  .price{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pair{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
  .scorebox{text-align:right}
  .scorebox .big{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
  .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}

/* ===== Indicators ===== */
function emaArr(a,n){var o=new Array(a.length).fill(NaN);if(a.length<n)return o;var s=0,i;for(i=0;i<n;i++)s+=a[i];var e=s/n,k=2/(n+1);o[n-1]=e;for(i=n;i<a.length;i++){e=a[i]*k+e*(1-k);o[i]=e;}return o;}
function rsiArr(c,n){n=n||14;var o=new Array(c.length).fill(NaN);if(c.length<=n)return o;var g=0,l=0,i,d;for(i=1;i<=n;i++){d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d;}var ag=g/n,al=l/n;o[n]=al===0?100:100-100/(1+ag/al);for(i=n+1;i<c.length;i++){d=c[i]-c[i-1];ag=(ag*(n-1)+(d>0?d:0))/n;al=(al*(n-1)+(d<0?-d:0))/n;o[i]=al===0?100:100-100/(1+ag/al);}return o;}
function atrArr(h,l,c,n){n=n||14;var tr=[h[0]-l[0]],i;for(i=1;i<c.length;i++)tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));var o=new Array(c.length).fill(NaN);if(c.length<n)return o;var a=0;for(i=0;i<n;i++)a+=tr[i];a/=n;o[n-1]=a;for(i=n;i<c.length;i++){a=(a*(n-1)+tr[i])/n;o[i]=a;}return o;}
function macdCalc(c){var e12=emaArr(c,12),e26=emaArr(c,26),i;var line=c.map(function(_,i){return isNaN(e26[i])?NaN:e12[i]-e26[i];});var st=25,s0=emaArr(line.slice(st),9),sig=new Array(c.length).fill(NaN);for(i=0;i<s0.length;i++)sig[st+i]=s0[i];var hist=line.map(function(v,i){return isNaN(sig[i])?NaN:v-sig[i];});return{line:line,sig:sig,hist:hist};}
function bbLast(c,n,m){n=n||20;m=m||2;if(c.length<n)return null;var s=c.slice(-n),mean=s.reduce(function(a,b){return a+b;},0)/n;var sd=Math.sqrt(s.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/n);var up=mean+m*sd,lo=mean-m*sd,p=c[c.length-1];return{mid:mean,up:up,lo:lo,pctB:(p-lo)/((up-lo)||1),bw:(up-lo)/mean};}
function pivots(h,l,k){var hi=[],lo=[],i,j;for(i=k;i<h.length-k;i++){var H=true,L=true;for(j=1;j<=k;j++){if(h[i]<=h[i-j]||h[i]<h[i+j])H=false;if(l[i]>=l[i-j]||l[i]>l[i+j])L=false;}if(H)hi.push(h[i]);if(L)lo.push(l[i]);}return hi.concat(lo);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}

/* ===== Extra indicators ===== */
function smaArr(a,n){var o=new Array(a.length).fill(NaN),i,j,s,ok;for(i=n-1;i<a.length;i++){s=0;ok=true;for(j=i-n+1;j<=i;j++){if(!isFinite(a[j])){ok=false;break;}s+=a[j];}if(ok)o[i]=s/n;}return o;}
function kdjArr(h,l,c,n){var K=[],D=[],J=[],k=50,d=50,i,j;for(i=0;i<c.length;i++){if(i<n-1){K.push(NaN);D.push(NaN);J.push(NaN);continue;}var hh=-Infinity,ll=Infinity;for(j=i-n+1;j<=i;j++){if(h[j]>hh)hh=h[j];if(l[j]<ll)ll=l[j];}var rsv=hh===ll?50:(c[i]-ll)/(hh-ll)*100;k=2/3*k+rsv/3;d=2/3*d+k/3;K.push(k);D.push(d);J.push(3*k-2*d);}return{K:K,D:D,J:J};}
function rocArr(c,n){return c.map(function(v,i){return i>=n?(v-c[i-n])/c[i-n]*100:NaN;});}
function wrArr(h,l,c,n){return c.map(function(v,i){if(i<n-1)return NaN;var hh=-Infinity,ll=Infinity;for(var j=i-n+1;j<=i;j++){if(h[j]>hh)hh=h[j];if(l[j]<ll)ll=l[j];}return hh===ll?-50:-100*(hh-v)/(hh-ll);});}
function cciArr(h,l,c,n){var tp=c.map(function(v,i){return(h[i]+l[i]+v)/3;}),m=smaArr(tp,n);return tp.map(function(v,i){if(!isFinite(m[i]))return NaN;var md=0;for(var j=i-n+1;j<=i;j++)md+=Math.abs(tp[j]-m[i]);md/=n;return md===0?0:(v-m[i])/(0.015*md);});}
function mfiArr(h,l,c,v,n){var tp=c.map(function(x,i){return(h[i]+l[i]+x)/3;}),pos=[0],neg=[0],i,j;for(i=1;i<c.length;i++){var f=tp[i]*v[i];pos.push(tp[i]>tp[i-1]?f:0);neg.push(tp[i]<tp[i-1]?f:0);}return c.map(function(_,i){if(i<n)return NaN;var p=0,q=0;for(j=i-n+1;j<=i;j++){p+=pos[j];q+=neg[j];}return q===0?100:100-100/(1+p/q);});}

function levelsFor(a){
  var N=Math.min(a.c.length,160),h=a.h.slice(-N),l=a.l.slice(-N);
  var pts=pivots(h,l,3).sort(function(x,y){return x-y;}),tol=(isFinite(a.atr)?a.atr:a.price*0.003)*0.5,cl=[];
  pts.forEach(function(p){var t=cl[cl.length-1];if(t&&Math.abs(p-t.p)<=tol){t.p=(t.p*t.n+p)/(t.n+1);t.n++;}else cl.push({p:p,n:1});});
  return cl;
}

/* ===== Mode aggregate and trade setup ===== */
function aggregate(modeKey,A){
  var M=MODES[modeKey],sw=0,s=0,tf;
  for(tf in M.w){if(A[tf]){s+=A[tf].bull*M.w[tf];sw+=M.w[tf];}}
  var conf=sw?s/sw:50,dir=conf>=58?"LONG":conf<=42?"SHORT":"ESPERAR",agree=0;
  for(tf in M.w){if(A[tf]){var t=A[tf].trend;if((dir==="LONG"&&t==="BULLISH")||(dir==="SHORT"&&t==="BEARISH")||(dir==="ESPERAR"&&t==="NEUTRAL"))agree+=M.w[tf];}}
  var bulls=0,tot=0;for(tf in M.w){if(A[tf]){tot++;if(A[tf].trend==="BULLISH")bulls++;}}
  return{conf:conf,dir:dir,align:sw?agree/sw:0,bulls:bulls,tot:tot};
}

function buildSetup(modeKey,A,ag){
  var M=MODES[modeKey],a=A[M.anchor];
  if(!a)for(var i=0;i<TFS.length;i++){if(A[TFS[i]]){a=A[TFS[i]];break;}}
  if(!a)return null;
  var price=a.price,atr=isFinite(a.atr)?a.atr:price*0.004,lv=levelsFor(a),s=ag.dir==="LONG"?1:ag.dir==="SHORT"?-1:0;
  var res=lv.filter(function(x){return x.p>price;}).sort(function(x,y){return x.p-y.p;});
  var sup=lv.filter(function(x){return x.p<price;}).sort(function(x,y){return y.p-x.p;});
  var out={dir:ag.dir,anchor:a.tf,a:a,atr:atr,price:price,res:res,sup:sup};
  if(!s){out.upTrigger=res[0]?res[0].p:price+atr;out.dnTrigger=sup[0]?sup[0].p:price-atr;return out;}
  var entry=price,entryNote="Mercado";
  if(isFinite(a.e21)&&s*(price-a.e21)>0.6*atr){entry=a.e21;entryNote="Límite en EMA 21 ("+a.tf+")";}
  var behind=lv.filter(function(x){return s*(entry-x.p)>0;}).sort(function(x,y){return s*(y.p-x.p);});
  var sl=entry-s*1.5*atr,slNote="1.5 × ATR";
  for(var j=0;j<behind.length;j++){var d=s*(entry-behind[j].p);if(d>=0.8*atr&&d<=3*atr){sl=behind[j].p-s*0.25*atr;slNote=(s>0?"Bajo soporte ":"Sobre resistencia ")+fmtN(behind[j].p,a.price);break;}}
  var risk=s*(entry-sl);
  var ahead=lv.filter(function(x){return s*(x.p-entry)>0;}).sort(function(x,y){return s*(x.p-y.p);});
  var tp1=entry+s*2*risk,tp1Note="2R proyectado",tp2=entry+s*3*risk,tp2Note="3R proyectado",k;
  for(k=0;k<ahead.length;k++){if(s*(ahead[k].p-entry)>=risk){tp1=ahead[k].p;tp1Note="Nivel "+fmtN(ahead[k].p,a.price);break;}}
  for(var m=0;m<ahead.length;m++){if(s*(ahead[m].p-tp1)>0&&s*(ahead[m].p-entry)>=2*risk){tp2=ahead[m].p;tp2Note="Nivel "+fmtN(ahead[m].p,a.price);break;}}
  out.entry=entry;out.entryNote=entryNote;out.sl=sl;out.slNote=slNote;out.tp1=tp1;out.tp1Note=tp1Note;out.tp2=tp2;out.tp2Note=tp2Note;out.risk=risk;
  out.rr1=s*(tp1-entry)/risk;out.rr2=s*(tp2-entry)/risk;
  return out;
}

/* ===== Formatting ===== */
function dec(sym){return sym==="BTC"?1:sym==="ETH"?2:3;}
function usd(n,d){return(n==null||!isFinite(n))?"—":"$"+n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtN(p,ref){return p.toLocaleString("en-US",{maximumFractionDigits:ref>1000?0:ref>100?1:2});}
function pct(x){return Math.round(x)+"%";}
function tcol(t){return t==="BULLISH"?"var(--up)":t==="BEARISH"?"var(--dn)":"var(--warn)";}
function dname(d){return d==="LONG"?"LONG":d==="SHORT"?"SHORT":"ESPERAR";}
function stamp(ms){try{return new Date(ms).toLocaleString("es",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}

function parseSnap(){
  var d={},f={};
  TFS.forEach(function(tf){
    var rows=SNAP_RAW[tf].split(";").map(function(r){return r.split(",").map(Number);}),vr=SNAP_VOL[tf].split(",").map(Number),h=[],l=[],c=[],v=[];
    for(var i=rows.length-1;i>=0;i--){h.push(rows[i][0]);l.push(rows[i][1]);c.push(rows[i][2]);v.push(vr[i]/1000);}
    d[tf]={h:h,l:l,c:c,v:v};
    var fm=SNAP_FORMING[tf];f[tf]={h:fm[0],l:fm[1],c:fm[2],v:SNAP_FVOL[tf]/1000};
  });
  return{d:d,f:f};
}

/* ===== Live data: REST candles + WebSocket ticks ===== */
function timeoutFetch(url,ms){
  var ctl=typeof AbortController!=="undefined"?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort();},ms);
  return fetch(url,{signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(t);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
}
function loadLive(sym){
  return Promise.all(TFS.map(function(tf){
    return timeoutFetch(REST+"?instId="+sym+"-USDT&bar="+tf+"&limit="+LIMITS[tf],7000).then(function(j){
      if(!j||j.code!=="0"||!j.data||j.data.length<40)throw new Error("datos incompletos "+tf);
      if(Date.now()-(+j.data[0][0])>2*BARMS[tf])return{tf:tf,stale:true};
      var rows=j.data.slice().reverse(),fm=null;
      var last=rows[rows.length-1];
      if(last[8]==="0"){fm={h:+last[2],l:+last[3],c:+last[4],v:+last[6]};rows.pop();}
      var h=[],l=[],c=[],v=[];rows.forEach(function(r){h.push(+r[2]);l.push(+r[3]);c.push(+r[4]);v.push(+r[6]);});
      if(!fm){fm={h:h[h.length-1],l:l[l.length-1],c:c[c.length-1],v:v[v.length-1]};h.pop();l.pop();c.pop();v.pop();}
      return{tf:tf,ser:{h:h,l:l,c:c,v:v},fm:fm};
    });
  })).then(function(all){
    var d={},f={},stale=[];all.forEach(function(x){if(x.stale){stale.push(x.tf);return;}d[x.tf]=x.ser;f[x.tf]=x.fm;});
    var pk=TFS.filter(function(t){return f[t];})[0];if(!pk)throw new Error("datos desactualizados");
    S.data=d;S.forming=f;S.stale=stale;S.price=f[pk].c;S.asOf=Date.now();S.source="live";S.err="";recompute();
  });
}
var wsCtl=null;
function stopWS(){if(wsCtl){wsCtl.stop();wsCtl=null;}S.ws="OFF";}
function connectWS(sym){
  stopWS();
  var cancelled=false,ws=null,ping,retry,attempts=0,lastMsg=Date.now(),inst=sym+"-USDT";
  function lv(rows){return rows.slice(0,5).map(function(r){return[parseFloat(r[0]),parseFloat(r[1])];}).filter(function(x){return isFinite(x[0])&&isFinite(x[1]);});}
  function open(){
    if(cancelled)return;S.ws="CONNECTING";
    var sk=new WebSocket(WS_URL);ws=sk;
    sk.onopen=function(){if(cancelled||ws!==sk)return;attempts=0;lastMsg=Date.now();S.ws="OPEN";sk.send(JSON.stringify({op:"subscribe",args:[{channel:"tickers",instId:inst},{channel:"books5",instId:inst}]}));
      ping=setInterval(function(){if(Date.now()-lastMsg>45000){sk.close();return;}if(sk.readyState===1)sk.send("ping");},20000);schedule();};
    sk.onmessage=function(ev){
      if(cancelled||ws!==sk)return;lastMsg=Date.now();if(ev.data==="pong")return;
      try{var r=JSON.parse(ev.data);if(!r.arg||r.arg.instId!==inst||!r.data||!r.data.length)return;
        if(r.arg.channel==="tickers"){var p=parseFloat(r.data[0].last);if(isFinite(p)){S.price=p;bump(p);schedule();}}
        else if(r.arg.channel==="books5"){S.book={asks:lv(r.data[0].asks),bids:lv(r.data[0].bids)};if(S.tab==="book")schedule();}
      }catch(e){}
    };
    sk.onerror=function(){try{sk.close();}catch(e){}};
    sk.onclose=function(){if(ping)clearInterval(ping);if(cancelled||ws!==sk)return;S.ws="DOWN";schedule();retry=setTimeout(open,Math.min(1000*Math.pow(2,attempts++),15000));};
  }
  wsCtl={stop:function(){cancelled=true;clearInterval(ping);clearTimeout(retry);if(ws){ws.onopen=ws.onmessage=ws.onerror=ws.onclose=null;try{ws.close();}catch(e){}}},
    kick:function(){if(ws&&Date.now()-lastMsg>15000){try{ws.close();}catch(e){}}}};
  open();
}
function bump(p){TFS.forEach(function(tf){var f=S.forming[tf];if(!f)return;f.c=p;if(p>f.h)f.h=p;if(p<f.l)f.l=p;});}

var pending=null;
function schedule(){if(pending)return;pending=setTimeout(function(){pending=null;if(S.source==="live")recompute();render();},700);}

function start(sym){
  S.sym=sym;S.source="loading";S.book={asks:[],bids:[]};S.err="";stopWS();
  if(sym==="BTC"){useSnapshot();S.source="loading";}else{S.data={};S.forming={};S.A={};S.price=null;}
  render();
  loadLive(sym).then(function(){connectWS(sym);render();}).catch(function(e){
    S.err=(e&&e.message)?e.message:"sin conexión";
    if(sym==="BTC"){useSnapshot();}else{S.source="none";S.data={};S.forming={};S.A={};S.price=null;}
    render();
  });
}

function chartSVG(a,st){
  var W=340,H=170,pl=6,pr=80,pt=8,pb=10,N=Math.min(90,a.c.length);
  var c=a.c.slice(-N),e21=a.E21.slice(-N),e50=a.E50.slice(-N),lo=Math.min.apply(null,c),hi=Math.max.apply(null,c);
  var marks=[];
  if(st&&st.dir!=="ESPERAR"&&st.entry!=null){marks.push({v:st.entry,t:"ENT",col:"var(--fg)"},{v:st.sl,t:"SL",col:"var(--dn)"},{v:st.tp1,t:"TP1",col:"var(--up)"});}
  marks.forEach(function(m){lo=Math.min(lo,m.v);hi=Math.max(hi,m.v);});
  var pad=(hi-lo)*0.07||1;lo-=pad;hi+=pad;
  function X(i){return pl+(W-pl-pr)*(i/(N-1));}
  function Y(v){return pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));}
  function path(arr){var d="";arr.forEach(function(v,i){if(!isFinite(v))return;d+=(d?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);});return d;}
  var grid="";for(var g=0;g<=3;g++){var gy=pt+(H-pt-pb)*g/3;grid+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'"/>';}
  var labels=marks.map(function(m){return{y:Y(m.v),t:m.t+" "+fmtN(m.v,a.price),col:m.col};});
  labels.push({y:Y(c[c.length-1]),t:fmtN(c[c.length-1],a.price),col:"var(--acc)",bold:1});
  labels.sort(function(x,y){return x.y-y.y;});
  for(var i=1;i<labels.length;i++){if(labels[i].y-labels[i-1].y<11)labels[i].y=labels[i-1].y+11;}
  var lines=marks.map(function(m){return'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(m.v).toFixed(1)+'" y2="'+Y(m.v).toFixed(1)+'" stroke="'+m.col+'" stroke-width="1" stroke-dasharray="4 3" opacity=".85"/>';}).join("");
  var tx=labels.map(function(l){return'<text class="t'+(l.bold?" tb":"")+'" x="'+(W-pr+4)+'" y="'+(l.y+3).toFixed(1)+'" style="fill:'+l.col+'">'+l.t+'</text>';}).join("");
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Precio '+a.tf+' con EMA 21 y EMA 50">'+grid+
    '<path d="'+path(e50)+'" fill="none" stroke="var(--dim)" stroke-width="1.4"/>'+
    '<path d="'+path(e21)+'" fill="none" stroke="var(--warn)" stroke-width="1.4"/>'+lines+
    '<path d="'+path(c)+'" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round"/>'+tx+'</svg>';
}

}

function book(){
  var d=dec(S.sym);
  if(S.source!=="live")return'<div class="card"><h2>Libro de órdenes</h2><p class="msg" style="margin:8px 0 0">El libro requiere conexión en vivo con BloFin. En esta vista de snapshot no está disponible.</p></div>';
  if(!S.book.asks.length&&!S.book.bids.length)return'<div class="card"><h2>Libro de órdenes</h2><p class="msg" style="margin:8px 0 0">'+(S.ws==="OPEN"?"Esperando datos del libro…":"Sin conexión de ticks con BloFin.")+'</p></div>';
  var asks=S.book.asks.slice().reverse().map(function(r){return'<div><span class="dn">'+usd(r[0],d)+'</span><span>'+r[1].toLocaleString("en-US",{maximumFractionDigits:2})+'</span></div>';}).join("");
  var bids=S.book.bids.map(function(r){return'<div><span class="up">'+usd(r[0],d)+'</span><span>'+r[1].toLocaleString("en-US",{maximumFractionDigits:2})+'</span></div>';}).join("");
  var bv=0,av=0;S.book.bids.forEach(function(r){bv+=r[1];});S.book.asks.forEach(function(r){av+=r[1];});
  var imb=bv+av?bv/(bv+av)*100:50;
  return'<div class="card"><div class="row" style="margin-bottom:8px"><h2>Libro BloFin · '+S.sym+'/USDT</h2><span class="lbl">tamaño en contratos</span></div><div class="book">'+asks+'<div class="mid">'+usd(S.price,d)+'</div>'+bids+'</div></div>'+
    '<div class="card"><div class="lbl">Presión de compra (5 niveles)</div><div class="num" style="font-size:20px;margin-top:4px;color:'+(imb>=55?"var(--up)":imb<=45?"var(--dn)":"var(--warn)")+'">'+imb.toFixed(0)+'% bids</div></div>';
}

function footer(){
  var src=S.source==="live"?"Velas en vivo de BloFin, actualizadas cada minuto.":S.source==="snapshot"?"Snapshot de velas BloFin BTC-USDT del "+stamp(S.asOf)+(S.err?". Conexión en vivo no disponible ("+S.err+").":". Abre la versión web para datos en vivo."):"";
  if(S.source==="live"&&S.stale.length)src+=" Omitidas por datos desactualizados de BloFin: "+S.stale.join(", ")+".";
  return'<p class="foot" style="margin:14px 0 0">'+src+' Indicadores: EMA 9/21/50/200, RSI 14, MACD 12-26-9, VOL, KDJ 9-3-3, ROC 12, Williams %R 14, CCI 20, MFI 14, OBV, StochRSI 14, Bollinger 20-2, ATR 14. Análisis técnico automático; no es asesoría financiera.</p>';
}

function render(){
  var ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&root.contains(ae))return;
  var hasA=Object.keys(S.A).length>0,ag=hasA?aggregate(S.mode,S.A):null,st=hasA?buildSetup(S.mode,S.A,ag):null,body;
  if(!hasA)body=noData();
  else if(S.tab==="resumen")body=resumen(ag,st);
  else if(S.tab==="matrix")body=matrix();
  else if(S.tab==="ind")body=indTab();
  else if(S.tab==="setups")body=setups();
  else body=book();
  root.innerHTML=head(ag)+tabsHTML()+'<div class="panel">'+body+'</div>'+footer();
  if(hasA&&S.tab==="setups")calcOut();
}

root.addEventListener("click",function(e){
  var t=e.target.closest("[data-sym],[data-mode],[data-tab],[data-itf]");if(!t)return;
  if(t.dataset.itf){S.itf=t.dataset.itf;render();return;}
  if(t.dataset.sym){if(t.dataset.sym!==S.sym)start(t.dataset.sym);return;}
  if(t.dataset.mode){S.mode=t.dataset.mode;LS.set("mtf.mode",S.mode);render();return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();}
});
root.addEventListener("input",function(e){
  if(e.target.id==="bal"){S.bal=e.target.value;LS.set("mtf.bal",S.bal);calcOut();}
  else if(e.target.id==="rk"){S.risk=e.target.value;LS.set("mtf.risk",S.risk);calcOut();}
});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible"||S.source!=="live")return;
  if(wsCtl)wsCtl.kick();
  loadLive(S.sym).then(function(){render();}).catch(function(){});
});
setInterval(function(){
  if(document.visibilityState!=="visible"||S.source!=="live")return;
  loadLive(S.sym).then(function(){render();}).catch(function(){});
},60000);

window.__MTF={kdj:kdjArr,roc:rocArr,wr:wrArr,cci:cciArr,mfi:mfiArr,obv:obvArr,stoch:stochRsiArr,sma:smaArr,S:S,analyze:analyze,aggregate:aggregate,buildSetup:buildSetup,parseSnap:parseSnap,emaArr:emaArr,rsiArr:rsiArr,macdCalc:macdCalc,atrArr:atrArr,bbLast:bbLast};
start("BTC");
})();
</script>
