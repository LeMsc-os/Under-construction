<title>BloFin MTF Analyzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one phone-width terminal column. Header, mode switch, tabs, then panels. Single dark look. */
  :root{
    --bg:#04080f; --panel:#09121d; --panel2:#0d1a29; --line:#15293e;
    --fg:#d5e5f6; --mut:#7692ae; --dim:#46617d;
    --acc:#00ffcc; --up:#00d4a0; --dn:#ff4d6d; --warn:#f0b429;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    color-scheme:dark;
  }
  html,body{background:var(--bg)}
  body{margin:0;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
  .wrap{max-width:480px;margin-inline:auto;padding-inline:16px;padding-block:14px}
  #app{min-width:0}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .dn{color:var(--dn)} .warn{color:var(--warn)} .mut{color:var(--mut)} .acc{color:var(--acc)}
  button{font-family:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation}
  button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

  .hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px}
  .seggrp{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:12px;padding:7px 12px;border-radius:6px;cursor:pointer;min-height:34px}
  .seg.on{background:var(--acc);color:#03130f}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;border:1px solid currentColor;margin-left:8px;vertical-align:middle}
  .price{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pair{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
  .scorebox{text-align:right}
  .scorebox .big{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
  .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}

  .modes{display:flex;margin-top:12px}

  .panel{margin-top:14px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}

  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.04em}
  .chip.LONG,.chip.BULLISH{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}

  .verdict{font-size:20px;font-weight:600;margin:6px 0 2px}
  .sub{font-size:12.5px;color:var(--mut)}

function connectWS(sym){
  stopWS();
  var cancelled=false,ws=null,ping,retry,attempts=0,lastMsg=Date.now(),inst=sym+"-USDT";
  function lv(rows){return rows.slice(0,5).map(function(r){return[parseFloat(r[0]),parseFloat(r[1])];}).filter(function(x){return isFinite(x[0])&&isFinite(x[1]);});}
  function open(){
    if(cancelled)return;S.ws="CONNECTING";
    var sk=new WebSocket(WS_URL);ws=sk;
    sk.onopen=function(){if(cancelled||ws!==sk)return;attempts=0;lastMsg=Date.now();S.ws="OPEN";sk.send(JSON.stringify({op:"subscribe",args:[{channel:"tickers",instId:inst},{channel:"books5",instId:inst}]}));
      ping=setInterval(function(){if(Date.now()-lastMsg>45000){sk.close();return;}if(sk.readyState===1)sk.send("ping");},20000);schedule();};
    sk.onmessage=function(ev){
      if(cancelled||ws!==sk)return;lastMsg=Date.now();if(ev.data==="pong")return;
      try{var r=JSON.parse(ev.data);if(!r.arg||r.arg.instId!==inst||!r.data||!r.data.length)return;
        if(r.arg.channel==="tickers"){var p=parseFloat(r.data[0].last);if(isFinite(p)){S.price=p;bump(p);schedule();}}
        else if(r.arg.channel==="books5"){S.book={asks:lv(r.data[0].asks),bids:lv(r.data[0].bids)};if(S.tab==="book")schedule();}
      }catch(e){}
    };
    sk.onerror=function(){try{sk.close();}catch(e){}};
    sk.onclose=function(){if(ping)clearInterval(ping);if(cancelled||ws!==sk)return;S.ws="DOWN";schedule();retry=setTimeout(open,Math.min(1000*Math.pow(2,attempts++),15000));};
  }
  wsCtl={stop:function(){cancelled=true;clearInterval(ping);clearTimeout(retry);if(ws){ws.onopen=ws.onmessage=ws.onerror=ws.onclose=null;try{ws.close();}catch(e){}}},
    kick:function(){if(ws&&Date.now()-lastMsg>15000){try{ws.close();}catch(e){}}}};
  open();
}
function bump(p){TFS.forEach(function(tf){var f=S.forming[tf];if(!f)return;f.c=p;if(p>f.h)f.h=p;if(p<f.l)f.l=p;});}

var pending=null;
function schedule(){if(pending)return;pending=setTimeout(function(){pending=null;if(S.source==="live")recompute();render();},700);}

function start(sym){
  S.sym=sym;S.long=null;S.longErr="";S.hist=null;S.nyDays=null;S.histBars=null;S.histAt=0;S.histErr="";S.source="loading";S.book={asks:[],bids:[]};S.err="";stopWS();
  if(sym==="BTC"){useSnapshot();S.source="loading";}else{S.data={};S.forming={};S.A={};S.price=null;}
  render();
  loadLive(sym).then(function(){connectWS(sym);render();loadHist(sym,true).then(function(){render();});loadLong(sym).then(function(){render();});}).catch(function(e){
    S.err=(e&&e.message)?e.message:"no connection";
    if(sym==="BTC"){useSnapshot();}else{S.source="none";S.data={};S.forming={};S.A={};S.price=null;}
    render();
  });
}

function chartSVG(a,st){
  var W=340,H=170,pl=6,pr=80,pt=8,pb=10,N=Math.min(90,a.c.length);
  var c=a.c.slice(-N),e21=a.E21.slice(-N),e50=a.E50.slice(-N),lo=Math.min.apply(null,c),hi=Math.max.apply(null,c);
  var marks=[];
  if(st&&st.dir!=="ESPERAR"&&st.entry!=null){marks.push({v:st.entry,t:"ENT",col:"var(--fg)"},{v:st.sl,t:"SL",col:"var(--dn)"},{v:st.tp1,t:"TP1",col:"var(--up)"});}
  marks.forEach(function(m){lo=Math.min(lo,m.v);hi=Math.max(hi,m.v);});
  var pad=(hi-lo)*0.07||1;lo-=pad;hi+=pad;
  function X(i){return pl+(W-pl-pr)*(i/(N-1));}
  function Y(v){return pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));}
  function path(arr){var d="";arr.forEach(function(v,i){if(!isFinite(v))return;d+=(d?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);});return d;}
  var grid="";for(var g=0;g<=3;g++){var gy=pt+(H-pt-pb)*g/3;grid+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'"/>';}
  var labels=marks.map(function(m){return{y:Y(m.v),t:m.t+" "+fmtN(m.v,a.price),col:m.col};});
  labels.push({y:Y(c[c.length-1]),t:fmtN(c[c.length-1],a.price),col:"var(--acc)",bold:1});
  labels.sort(function(x,y){return x.y-y.y;});
  for(var i=1;i<labels.length;i++){if(labels[i].y-labels[i-1].y<11)labels[i].y=labels[i-1].y+11;}
  var lines=marks.map(function(m){return'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(m.v).toFixed(1)+'" y2="'+Y(m.v).toFixed(1)+'" stroke="'+m.col+'" stroke-width="1" stroke-dasharray="4 3" opacity=".85"/>';}).join("");
  var tx=labels.map(function(l){return'<text class="t'+(l.bold?" tb":"")+'" x="'+(W-pr+4)+'" y="'+(l.y+3).toFixed(1)+'" style="fill:'+l.col+'">'+l.t+'</text>';}).join("");
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Price '+a.tf+' with EMA 21 and EMA 50">'+grid+
    '<path d="'+path(e50)+'" fill="none" stroke="var(--dim)" stroke-width="1.4"/>'+
    '<path d="'+path(e21)+'" fill="none" stroke="var(--warn)" stroke-width="1.4"/>'+lines+
    '<path d="'+path(c)+'" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round"/>'+tx+'</svg>';
}

/* ===== New York open study: how the market behaved after past 9:30 ET opens (daily and weekly) ===== */
var NYH=1800000;
function nthSun(y,m,n){var d=new Date(Date.UTC(y,m,1)),first=1+((7-d.getUTCDay())%7);return Date.UTC(y,m,first+7*(n-1));}
function nyOff(ms){var y=new Date(ms).getUTCFullYear(),a=nthSun(y,2,2)+7*36e5,b=nthSun(y,10,1)+6*36e5;return(ms>=a&&ms<b)?-240:-300;}
function nyLocal(ms){var l=ms+nyOff(ms)*6e4,d=new Date(l);return{day:Math.floor(l/864e5),min:d.getUTCHours()*60+d.getUTCMinutes(),dow:d.getUTCDay()};}
function nyOpenMs(dayNum){return dayNum*864e5+570*6e4-nyOff(dayNum*864e5+14*36e5)*6e4;}
function nyPattern(o,h,l,c,preH,preL){
  var rng=(h-l)||1e-9,body=Math.abs(c-o),up=c>o,key,lab,bias,lw=(Math.min(o,c)-l)/rng,uw=(h-Math.max(o,c))/rng,shape="";
  if(h>preH&&c<preH){key="SWEEP_HI";lab="Swept the overnight high, then closed back inside (bearish rejection)";bias=-1;}
  else if(l<preL&&c>preL){key="SWEEP_LO";lab="Swept the overnight low, then closed back inside (bullish rejection)";bias=1;}
  else if(c>preH){key="BREAK_UP";lab="Broke above the overnight range and held";bias=1;}
  else if(c<preL){key="BREAK_DN";lab="Broke below the overnight range and held";bias=-1;}
  else{key=up?"IN_UP":"IN_DN";lab=up?"Stayed inside the overnight range with a bullish candle":"Stayed inside the overnight range with a bearish candle";bias=up?0.5:-0.5;}
  if(body/rng>=0.7)shape=up?"strong bullish body":"strong bearish body";else if(body/rng<=0.2)shape="doji (indecision)";
  if(lw>=0.5&&c>=l+0.6*rng)shape="hammer shape";else if(uw>=0.5&&c<=l+0.4*rng)shape="shooting-star shape";
  return{key:key,lab:lab,bias:bias,shape:shape};
}
function nyBuild(H){
  var n=H.t.length,i,q,L=H.t.map(nyLocal),days=[];
  for(i=0;i<n;i++){
    var lc=L[i];if(lc.min!==570||lc.dow<1||lc.dow>5)continue;
    var r={i:i,t:H.t[i],day:lc.day,dow:lc.dow,P0:H.o[i]};
    function win(k){var j=i-k;if(j<0||H.t[i]-H.t[j]!==k*NYH)return null;var hh=-Infinity,ll=Infinity;for(q=j;q<i;q++){hh=Math.max(hh,H.h[q]);ll=Math.min(ll,H.l[q]);}return{h:hh,l:ll,d:(r.P0-H.o[j])/H.o[j]};}
    var w=win(24);if(w){r.preH=w.h;r.preL=w.l;r.drift=w.d;}
    if(lc.dow===1){var ww=win(31);if(ww){r.wH=ww.h;r.wL=ww.l;r.wdrift=ww.d;}}
    if(i+1<n&&H.t[i+1]-H.t[i]===NYH&&H.k[i]&&H.k[i+1])r.fh={o:H.o[i],h:Math.max(H.h[i],H.h[i+1]),l:Math.min(H.l[i],H.l[i+1]),c:H.c[i+1]};
    var e=i+13;
    if(e<n&&H.t[e]-H.t[i]===13*NYH){var ok=true,hi=-Infinity,lo=Infinity;for(q=i;q<=e;q++){if(!H.k[q])ok=false;hi=Math.max(hi,H.h[q]);lo=Math.min(lo,H.l[q]);}r.hi=hi;r.lo=lo;if(ok){r.endC=H.c[e];r.done=true;}}
    days.push(r);
  }
  var byDay={};
  days.forEach(function(r,ix){
    byDay[r.day]=r;
    if(r.fh&&r.preH!=null)r.pat=nyPattern(r.fh.o,r.fh.h,r.fh.l,r.fh.c,r.preH,r.preL);
    var pv=days[ix-1];if(pv&&pv.done&&r.day-pv.day<=4)r.prevUp=pv.endC>pv.P0;
  });
  days.forEach(function(r){
    if(r.dow!==1)return;
    var f=byDay[r.day+4];if(f&&f.done){r.wEnd=f.endC;r.wDone=true;}
    if(r.wH!=null&&r.fh)r.wpat=nyPattern(r.fh.o,r.fh.h,r.fh.l,r.fh.c,r.wH,r.wL);
    var pm=byDay[r.day-7];if(pm&&pm.wDone)r.prevWUp=pm.wEnd>pm.P0;

}
function nyEst(samples,key,fk,fo){
  var n=samples.length;if(n<6)return null;
  var u=samples.filter(fo).length,base=u/n,same=samples.filter(function(r){return fk(r)===key;}),nk=same.length,uk=same.filter(fo).length,m=4;
  return{p:(uk+m*base)/(nk+m),n:n,nk:nk,uk:uk,base:base};
}
function medArr(a){if(!a.length)return NaN;var b=a.slice().sort(function(x,y){return x-y;}),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function nyLean(e){
  if(!e)return{dir:0,txt:"Not enough history",prob:0.5};
  var ed=e.p-0.5;if(e.nk<5||Math.abs(ed)<0.08)return{dir:0,txt:"No clear edge",prob:Math.max(e.p,1-e.p)};
  return{dir:ed>0?1:-1,txt:ed>0?"Leans UP":"Leans DOWN",prob:ed>0?e.p:1-e.p};
}
function nyView(){
  var H=S.hist,D=S.nyDays;if(!H||!D||D.length<10)return null;
  var now=S.nowO||Date.now(),L=nyLocal(now),dw=L.dow;
  function isWd(dn){var x=new Date(dn*864e5).getUTCDay();return x>=1&&x<=5;}
  var tDay=L.day;if(!(isWd(tDay)&&L.min<960)){do{tDay++;}while(!isWd(tDay));}
  var tMon=dw===1?L.day:(dw>=2&&dw<=4)?L.day-(dw-1):(dw===5&&L.min<960)?L.day-4:L.day+((8-dw)%7||7);
  var price=S.price||H.c[H.c.length-1];
  function drift(T0,k){if(T0<=now)return null;var ix=H.idx[T0-k*NYH];if(ix==null)return null;return(price-H.o[ix])/H.o[ix];}
  function rec(dn){for(var i=D.length-1;i>=0;i--){if(D[i].day===dn)return D[i];if(D[i].day<dn)break;}return null;}
  function status(T0,end){var m=Math.round((T0-now)/6e4);if(m>0)return"Opens in "+(m>=60?Math.floor(m/60)+"h "+(m%60)+"m":m+" min");if(now<T0+NYH*2)return"Open now · first-hour candle "+(now<T0+NYH*2-6e4?"forming":"done");return end;}
  var out={};
  // ---------- day
  (function(){
    var T0=nyOpenMs(tDay),r=rec(tDay),prev=null,i;for(i=D.length-1;i>=0;i--){if(D[i].day<tDay&&D[i].done){prev=D[i];break;}}
    var prevUp=prev&&tDay-prev.day<=4?prev.endC>prev.P0:null,dr=r&&r.drift!=null?r.drift:drift(T0,24);
    var S2=D.filter(function(x){return x.done;}),A=null,B=null,fo=function(x){return x.endC>x.P0;};
    if(dr!=null&&prevUp!=null)A=nyEst(S2.filter(function(x){return x.drift!=null&&x.prevUp!=null;}),(dr>0?"U":"D")+(prevUp?"U":"D"),function(x){return(x.drift>0?"U":"D")+(x.prevUp?"U":"D");},fo);
    else if(prevUp!=null)A=nyEst(S2.filter(function(x){return x.prevUp!=null;}),prevUp?"U":"D",function(x){return x.prevUp?"U":"D";},fo);
    if(r&&r.pat)B=nyEst(S2.filter(function(x){return x.pat;}),r.pat.key,function(x){return x.pat.key;},function(x){return x.endC>x.fh.c;});
    var moves=S2.map(function(x){return Math.abs(x.endC-x.P0)/x.P0;}),rngs=S2.filter(function(x){return x.hi;}).map(function(x){return(x.hi-x.lo)/x.P0;});
    out.day={label:new Date(tDay*864e5).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}),status:status(T0,"Session in progress"),A:A,B:B,pat:r&&r.pat,
      driftTxt:dr!=null?(dr>=0?"up ":"down ")+Math.abs(dr*100).toFixed(2)+"% before the open":null,prevTxt:prevUp==null?null:(prevUp?"up":"down"),
      P0:r?r.P0:null,H:r?r.preH:null,L:r?r.preL:null,sofar:r&&r.P0?(price-r.P0)/r.P0:null,med:medArr(moves),rng:medArr(rngs),ns:S2.length,T0:T0,live:!!r};
  })();
  // ---------- week
  (function(){
    var T0=nyOpenMs(tMon),r=rec(tMon),prev=null,i;for(i=D.length-1;i>=0;i--){if(D[i].dow===1&&D[i].day<tMon&&D[i].wDone){prev=D[i];break;}}
    var prevUp=prev&&tMon-prev.day<=7?prev.wEnd>prev.P0:null,dr=r&&r.wdrift!=null?r.wdrift:drift(T0,31);
    var S2=D.filter(function(x){return x.dow===1&&x.wDone;}),A=null,B=null,fo=function(x){return x.wEnd>x.P0;};
    if(dr!=null&&prevUp!=null)A=nyEst(S2.filter(function(x){return x.wdrift!=null&&x.prevWUp!=null;}),(dr>0?"U":"D")+(prevUp?"U":"D"),function(x){return(x.wdrift>0?"U":"D")+(x.prevWUp?"U":"D");},fo);
    else if(prevUp!=null)A=nyEst(S2.filter(function(x){return x.prevWUp!=null;}),prevUp?"U":"D",function(x){return x.prevWUp?"U":"D";},fo);
    if(r&&r.wpat)B=nyEst(S2.filter(function(x){return x.wpat;}),r.wpat.key,function(x){return x.wpat.key;},function(x){return x.wEnd>x.fh.c;});
    var moves=S2.map(function(x){return Math.abs(x.wEnd-x.P0)/x.P0;});
    out.week={label:"Week of "+new Date(tMon*864e5).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"}),status:status(T0,"Week in progress"),A:A,B:B,pat:r&&r.wpat,
      driftTxt:dr!=null?(dr>=0?"up ":"down ")+Math.abs(dr*100).toFixed(2)+"% since Sunday's open":null,prevTxt:prevUp==null?null:(prevUp?"up":"down"),
      P0:r?r.P0:null,H:r?r.wH:null,L:r?r.wL:null,sofar:r&&r.P0?(price-r.P0)/r.P0:null,med:medArr(moves),rng:NaN,ns:S2.length,T0:T0,live:!!r};
  })();
  return out;
}
function nyBlock(title,x,d){
  var main=x.B||x.A,isB=!!x.B,ln=nyLean(main),dirC=ln.dir>0?"LONG":ln.dir<0?"SHORT":"ESPERAR",col=ln.dir>0?"var(--up)":ln.dir<0?"var(--dn)":"var(--warn)";
  var up=main?(ln.dir<0?1-ln.prob:ln.dir>0?ln.prob:main.p):0.5,h='<div class="nyb"><div class="row"><b>'+title+' · '+x.label+'</b><span class="lbl">'+x.status+'</span></div>';

  if(main){
    h+='<div class="pbar"><i style="width:'+Math.round(up*100)+'%"></i></div><div class="row sub"><span>Down '+Math.round((1-up)*100)+'%</span><span>Up '+Math.round(up*100)+'%</span></div>';
    h+='<div class="sub" style="margin-top:6px">'+(isB?"After the first hour":"Pre-open read")+': in '+main.nk+' similar '+(title==="Day"?"days":"weeks")+' (of '+main.n+'), '+main.uk+' ended up and '+(main.nk-main.uk)+' down'+(main.nk<5?" · sample too small to lean":"")+'.</div>';
  }
  if(isB&&x.A){var la=nyLean(x.A);h+='<div class="sub" style="margin-top:3px">Pre-open read was: '+la.txt.toLowerCase()+(la.dir?" ("+Math.round(la.prob*100)+"%)":"")+'.</div>';}
  if(x.pat)h+='<div class="sub" style="margin-top:6px">Open pattern: '+x.pat.lab+(x.pat.shape?" · "+x.pat.shape:"")+'.</div>';
  else if(x.live)h+='<div class="sub" style="margin-top:6px">Waiting for the first-hour candle (closes 10:30 ET) to read the pattern.</div>';

/* ===== Swing detection (zigzag) shared by the Fibonacci and Elliott studies ===== */

}

  return'<div class="sc" style="--c:'+sigCol(x.sig)+'" title="'+x.name+': '+x.val+'">'+g+'<small>'+x.flag+'</small></div>';
}
function indTab(){
  var map='<div class="card"><div class="lbl" style="margin-bottom:8px">Signal map</div><div class="hm"><div></div>'+TFS.map(function(tf){return'<div class="hh">'+tf+'</div>';}).join("");
  IKEYS.forEach(function(k){map+='<div class="nm">'+INAME[k]+'</div>'+TFS.map(function(tf){return sigCell(findInd(S.A[tf],k));}).join("");});
  map+='</div><p class="msg" style="margin:10px 0 0;font-size:11.5px">▲ bullish · ▼ bearish · ◆ neutral · OB overbought · OS oversold</p></div>';
  var def=MODES[S.mode].anchor,tf=(S.itf&&S.A[S.itf])?S.itf:(S.A[def]?def:Object.keys(S.A)[0]),a=S.A[tf];
  var sel='<div class="seggrp" style="display:flex">'+TFS.map(function(t){return'<button class="seg'+(t===tf?" on":"")+'" style="flex:1;padding-inline:2px" data-itf="'+t+'">'+t+'</button>';}).join("")+'</div>';
  var rows=a.ind.map(function(x){
    var col=sigCol(x.sig),lab=x.sig==="BULL"?"BULLISH":x.sig==="BEAR"?"BEARISH":x.sig==="NA"?"—":"NEUTRAL";
    var fl=x.flag==="OB"?' <span class="chip NEUTRAL">OVERBOUGHT</span>':x.flag==="OS"?' <span class="chip NEUTRAL">OVERSOLD</span>':'';
    return'<div class="irow"><div class="row"><b>'+x.name+'</b><div class="num" style="font-size:13px">'+x.val+'</div></div>'+
      (x.g!=null?'<div class="gauge" style="--c:'+col+'"><i style="width:'+x.g.toFixed(0)+'%"></i></div>':'')+
      '<div class="row" style="margin-top:7px"><span class="sub">'+x.txt+'</span><span>'+(x.sig==="NA"?"":'<span class="chip '+x.sig.replace("BULL","BULLISH").replace("BEAR","BEARISH").replace("NEUT","NEUTRAL")+'">'+lab+'</span>')+fl+'</span></div></div>';
  }).join("");
  return map+'<div class="card"><div class="row" style="margin-bottom:10px"><h2>Detail</h2><span class="lbl">Timeframe</span></div>'+sel+'</div><div class="tbl">'+rows+'</div>';
}

var lastPair=null;
/* ===== Opportunity scanner: checklist and grade per mode and side ===== */
var HIGHER={"1m":"5m","5m":"15m","15m":"1H","1H":"4H","4H":"1D","1D":"1W","1W":null};
function scanSide(modeKey,side,st,ag){
  var M=MODES[modeKey],a=S.A[M.anchor]||st.a,h=S.A[HIGHER[a.tf]],s=side==="LONG"?1:-1,it=[],fin=isFinite,want=s>0?"BULLISH":"BEARISH",opp=s>0?"BEARISH":"BULLISH",c=S.ctx||{};
  function add(ok,yes,no){if(ok===null)return;it.push({ok:ok,txt:ok?yes:no});}
  add(ag.dir===side,"Mode score favors "+side.toLowerCase(),"Mode score does not favor "+side.toLowerCase()+" ("+pct(ag.conf)+")");
  add(a.trend===want,a.tf+" trend is "+want.toLowerCase(),a.tf+" trend is not "+want.toLowerCase()+" yet");
  add(h?h.trend!==opp:null,h?h.tf+" does not oppose":"","Higher timeframe ("+(h?h.tf:"")+") is "+opp.toLowerCase());
  if((modeKey==="SCALP"||modeKey==="DAY"))add(fin(c.vwap)?s*(st.price-c.vwap)>0:null,"Price on the "+(s>0?"upper":"lower")+" side of session VWAP","Price is "+(s>0?"below":"above")+" session VWAP");
  add(fin(a.adx)?(a.adx>=20&&s*(a.pdi-a.mdi)>0):null,"ADX "+Math.round(a.adx)+" with DI pointing your way",fin(a.adx)&&a.adx<20?"ADX "+Math.round(a.adx)+": weak trend, wait for expansion":"DI points against "+side.toLowerCase());
  add(fin(a.rsiV)?(s>0?a.rsiV<=72:a.rsiV>=28):null,"RSI "+Math.round(a.rsiV)+" is not exhausted","RSI "+Math.round(a.rsiV)+" is already "+(s>0?"overbought":"oversold"));
  add(fin(a.hist)&&fin(a.prev)?(s*a.hist>0&&s*(a.hist-a.prev)>=0):null,"MACD momentum supports it","MACD momentum is not with "+side.toLowerCase());
  add(fin(a.volRatio)?a.volRatio>=0.8:null,"Volume is normal or higher","Volume is thin (×"+(fin(a.volRatio)?a.volRatio.toFixed(1):"?")+" average)");
  add(fin(a.e21)&&fin(a.atr)?s*(st.price-a.e21)<=1.2*a.atr:null,"Price is not stretched from EMA 21","Price is stretched from EMA 21: wait for a pullback");
  if(modeKey==="SCALP"||modeKey==="DAY"){var rs=revCount(side);add(rs.have?rs.opp<2:null,"No 1m/5m reversal signs against it","1m/5m show "+rs.opp+" reversal signs against "+side.toLowerCase()+" ("+rs.oppTxt.slice(0,1).join("")+")");}
  add(st.rr1>=1.5,"Target 1 gives R:R "+st.rr1.toFixed(1),"Target 1 only gives R:R "+st.rr1.toFixed(1));
  var pass=it.filter(function(x){return x.ok;}).length,tot=it.length,r=tot?pass/tot:0,g=r>=0.8?"A":r>=0.6?"B":"C";
  if(!it[0].ok&&h&&h.trend===opp)g="C";
  return{grade:g,pass:pass,tot:tot,items:it,wait:it.filter(function(x){return!x.ok;}).map(function(x){return x.txt;})};
}
function revCount(side){
  var o={have:false,opp:0,pro:0,oppTxt:[],proTxt:[]};
  ["1m","5m"].forEach(function(tf){var a=S.A[tf];if(!a||!a.rev)return;o.have=true;
    var opp=side==="LONG"?a.rev.bear:a.rev.bull,pro=side==="LONG"?a.rev.bull:a.rev.bear;
    o.opp+=opp.length;o.pro+=pro.length;opp.forEach(function(t){o.oppTxt.push(tf+": "+t);});pro.forEach(function(t){o.proTxt.push(tf+": "+t);});});
  return o;
}
function revCard(ag){
  var a1=S.A["1m"],a5=S.A["5m"];if(!a5&&!a1)return"";
  var up=revCount("LONG"),bu=up.pro,be=up.opp,verdict,col;
  if(bu>=2&&bu>be){verdict="Bullish reversal signs";col="var(--up)";}
  else if(be>=2&&be>bu){verdict="Bearish reversal signs";col="var(--dn)";}
  else if(bu+be===0){verdict="No reversal signs";col="var(--mut)";}
  else{verdict="Mixed short-term signals";col="var(--warn)";}
  var tip=(verdict==="Bullish reversal signs")?(ag.dir==="SHORT"?"Against the short bias: avoid new shorts or tighten stops.":ag.dir==="LONG"?"Supports long entries.":"A bounce may be starting; wait for the 15m to confirm."):
    (verdict==="Bearish reversal signs")?(ag.dir==="LONG"?"Against the long bias: avoid new longs or tighten stops.":ag.dir==="SHORT"?"Supports short entries.":"A drop may be starting; wait for the 15m to confirm."):"Nothing to act on yet.";
  function row(tf,a){if(!a)return'<div class="row" style="margin-top:8px"><b>'+tf+'</b><span class="mut" style="font-size:12px">Needs the live connection (not in the snapshot)</span></div>';
    var l=a.rev.bull.map(function(t){return'<li class="up">▲ '+t+'</li>';}).concat(a.rev.bear.map(function(t){return'<li class="dn">▼ '+t+'</li>';}));
    return'<div class="row" style="margin-top:8px"><b>'+tf+'</b>'+chip(a.trend,a.trend)+'</div>'+(l.length?'<ul class="chk">'+l.join("")+'</ul>':'<div class="bsub">No reversal signals</div>');}
  return'<div class="card" style="--c:'+col+'"><div class="row"><h2>Short-term reversal watch</h2><span class="lbl" style="color:'+col+'">1m + 5m</span></div><p class="msg" style="margin:4px 0 0"><b style="color:'+col+'">'+verdict+'.</b> '+tip+'</p>'+row("1m",a1)+row("5m",a5)+'</div>';
}
var GCOL={A:"var(--up)",B:"var(--warn)",C:"var(--dim)"};
function gradeChip(g){return'<span class="gr" style="--c:'+GCOL[g.grade]+'">'+g.grade+' · '+g.pass+'/'+g.tot+'</span>';}
function scanAll(){
  var o=[];Object.keys(MODES).forEach(function(k){var p=pairFor(k);["LONG","SHORT"].forEach(function(sd){var st=sd==="LONG"?p.L:p.S;if(st&&st.entry!=null)o.push({mode:k,side:sd,st:st,g:scanSide(k,sd,st,p.ag)});});});
  return o;
}
function scanCard(){
  var all=scanAll();if(!all.length)return"";
  var rank={A:3,B:2,C:1};all.sort(function(x,y){return rank[y.g.grade]*100+y.g.pass-rank[x.g.grade]*100-x.g.pass;});
  var top=all.filter(function(x){return x.g.grade!=="C";}).slice(0,3),d=dec(S.sym);
  var body=top.length?top.map(function(x){var col=x.side==="LONG"?"var(--up)":"var(--dn)";
    return'<div class="srow" style="--c:'+col+'"><div class="row"><span>'+chip(x.side,x.side)+' <b>'+MODES[x.mode].label+'</b></span><span>'+gradeChip(x.g)+'</span></div><div class="kv num"><span><i>Entry</i> '+usd(x.st.entry,d)+'</span><span><i>SL</i> <b class="dn">'+usd(x.st.sl,d)+'</b></span><span><i>TP1</i> <b class="up">'+usd(x.st.tp1,d)+'</b></span></div>'+(x.g.wait.length?'<div class="bsub">Still missing: '+x.g.wait.slice(0,2).join(" · ")+'</div>':'<div class="bsub">All checks pass</div>')+'</div>';}).join("")
    :'<p class="msg" style="margin:6px 0 0">No A or B setup in any mode right now. Best to wait. Check back when a new candle closes.</p>';
  var c=S.ctx||{},bits=[];if(isFinite(c.vwap))bits.push("VWAP "+usd(c.vwap,d));if(isFinite(c.pdh))bits.push("PDH "+usd(c.pdh,d));if(isFinite(c.pdl))bits.push("PDL "+usd(c.pdl,d));
  return'<div class="card"><div class="row" style="margin-bottom:2px"><h2>Best opportunities now</h2><span class="lbl">A = 80%+ of checks</span></div>'+body+(bits.length?'<div class="sub" style="margin-top:8px">'+bits.join(" · ")+'</div>':'')+'</div>';
}
function checkList(g){return'<ul class="chk">'+g.items.map(function(x){return'<li class="'+(x.ok?"ok":"no")+'">'+(x.ok?"✓ ":"✗ ")+x.txt+'</li>';}).join("")+'</ul>';}

function pairFor(k){
  var ag=aggregate(k,S.A);
  return{ag:ag,L:buildSetup(k,S.A,ag,"LONG"),S:buildSetup(k,S.A,ag,"SHORT")};
}
function tagFor(side,fav){return fav==="ESPERAR"?'<span class="mut">optional</span>':(fav===side?'<span class="fav">FAVORED</span>':'<span class="mut">counter-trend</span>');}
function sideRow(side,st,fav,d,gr){
  var col=side==="LONG"?"var(--up)":"var(--dn)";
  return'<div class="srow" style="--c:'+col+'"><div class="row"><span>'+chip(side,side)+' '+tagFor(side,fav)+'</span><span>'+(gr?gradeChip(gr)+' ':'')+'<span class="num mut">R:R '+st.rr1.toFixed(1)+'</span></span></div>'+
    '<div class="kv num"><span><i>Entry</i> '+usd(st.entry,d)+'</span><span><i>SL</i> <b class="dn">'+usd(st.sl,d)+'</b></span><span><i>TP1</i> <b class="up">'+usd(st.tp1,d)+'</b></span></div></div>';
}
function sides(){
  var p=pairFor(S.mode),d=dec(S.sym),fav=p.ag.dir;
  if(!p.L||!p.S||p.L.entry==null||p.S.entry==null)return"";
  return'<div class="card"><div class="row" style="margin-bottom:4px"><h2>Long vs short · '+MODES[S.mode].label+'</h2><span class="lbl">'+(fav==="ESPERAR"?"no clear edge":"favors "+fav.toLowerCase())+'</span></div>'+
    sideRow("LONG",p.L,fav,d,scanSide(S.mode,"LONG",p.L,p.ag))+sideRow("SHORT",p.S,fav,d,scanSide(S.mode,"SHORT",p.S,p.ag))+'</div>';
}
function setupCard(side,st,fav,d,ag){
  var gr=scanSide(S.mode,side,st,ag);
  var col=side==="LONG"?"var(--up)":"var(--dn)";
  var note=fav==="ESPERAR"?"No clear edge right now. Only take this if the trigger below happens.":(fav===side?"This is the side the indicators favor.":"Against the current bias. Higher risk: only with your own reason.");
  return'<div class="card'+(fav===side?" hero":"")+'" style="--c:'+col+'"><div class="row"><div>'+chip(side,side+" setup")+' '+tagFor(side,fav)+'</div><span class="lbl">Anchor '+st.anchor+'</span></div>'+
    '<p class="msg" style="margin:6px 0 0">'+note+'</p>'+banner(statusFor(S.mode,side,st,fav))+'<div class="row" style="margin-top:10px"><span class="lbl">Setup grade</span>'+gradeChip(gr)+'</div>'+checkList(gr)+setupCells(st)+'</div>';
}
function setups(){
  var d=dec(S.sym),p=pairFor(S.mode),fav=p.ag.dir,html="";
  lastPair=p;
  if(!p.L||!p.S)return'<p class="msg">No setup available.</p>';
  var col=fav==="LONG"?"var(--up)":fav==="SHORT"?"var(--dn)":"var(--warn)";
  var why=fav==="LONG"?"Score is 58% or higher, so the page favors the long.":fav==="SHORT"?"Score is 42% or lower, so the page favors the short.":"Score is between 42% and 58%: no clear edge. Wait for price to close above "+usd(p.L.upTrigger!=null?p.L.upTrigger:(p.L.res[0]?p.L.res[0].p:p.L.price),d)+" (long) or lose "+usd(p.S.dnTrigger!=null?p.S.dnTrigger:(p.S.sup[0]?p.S.sup[0].p:p.S.price),d)+" (short).";
  html+='<div class="card" style="--c:'+col+'"><div class="row"><div>'+chip(fav,dname(fav))+' <b style="margin-left:6px">'+MODES[S.mode].label+'</b></div><span class="num" style="color:'+col+'">'+pct(p.ag.conf)+'</span></div><p class="msg" style="margin:6px 0 0">'+why+' Both sides are shown below.</p></div>';
  var order=fav==="SHORT"?["SHORT","LONG"]:["LONG","SHORT"];
  order.forEach(function(sd){html+=setupCard(sd,sd==="LONG"?p.L:p.S,fav,d,p.ag);});
  var others=Object.keys(MODES).filter(function(k){return k!==S.mode;}).map(function(k){
    var ag=aggregate(k,S.A),c=ag.dir==="LONG"?"var(--up)":ag.dir==="SHORT"?"var(--dn)":"var(--warn)";
    var pp=pairFor(k),gl=pp.L&&pp.L.entry!=null?scanSide(k,"LONG",pp.L,ag):null,gs=pp.S&&pp.S.entry!=null?scanSide(k,"SHORT",pp.S,ag):null;
    return'<button class="mrow" data-mode="'+k+'"><span><b>'+MODES[k].label+'</b> <span class="mut">'+chip(ag.dir,dname(ag.dir))+' '+pct(ag.conf)+'</span></span><span class="num" style="font-size:11.5px">L '+(gl?gl.grade:"–")+' · S '+(gs?gs.grade:"–")+'</span></button>';
  }).join("");
  html+='<div class="card"><div class="lbl" style="margin-bottom:2px">Other modes</div>'+others+'</div>';
  return html+'<p class="foot">Levels come from ATR, pivots and key levels. Grades are a checklist, not a guarantee. Always check the context before trading.</p>';
}

function book(){
  var d=dec(S.sym);
  if(S.source!=="live")return'<div class="card"><h2>Order book</h2><p class="msg" style="margin:8px 0 0">The order book needs a live BloFin connection. It is not available in this snapshot view.</p></div>';
  if(!S.book.asks.length&&!S.book.bids.length)return'<div class="card"><h2>Order book</h2><p class="msg" style="margin:8px 0 0">'+(S.ws==="OPEN"?"Waiting for order book data…":"No tick connection to BloFin.")+'</p></div>';
  var asks=S.book.asks.slice().reverse().map(function(r){return'<div><span class="dn">'+usd(r[0],d)+'</span><span>'+r[1].toLocaleString("en-US",{maximumFractionDigits:2})+'</span></div>';}).join("");
  var bids=S.book.bids.map(function(r){return'<div><span class="up">'+usd(r[0],d)+'</span><span>'+r[1].toLocaleString("en-US",{maximumFractionDigits:2})+'</span></div>';}).join("");
  var bv=0,av=0;S.book.bids.forEach(function(r){bv+=r[1];});S.book.asks.forEach(function(r){av+=r[1];});
  var imb=bv+av?bv/(bv+av)*100:50;
  return'<div class="card"><div class="row" style="margin-bottom:8px"><h2>BloFin book · '+S.sym+'/USDT</h2><span class="lbl">size in contracts</span></div><div class="book">'+asks+'<div class="mid">'+usd(S.price,d)+'</div>'+bids+'</div></div>'+
    '<div class="card"><div class="lbl">Buy pressure (5 levels)</div><div class="num" style="font-size:20px;margin-top:4px;color:'+(imb>=55?"var(--up)":imb<=45?"var(--dn)":"var(--warn)")+'">'+imb.toFixed(0)+'% bids</div></div>';
}

function footer(){
  var src=S.source==="live"?"Live BloFin candles, refreshed every minute.":S.source==="snapshot"?"BloFin BTC-USDT candle snapshot from "+stamp(S.asOf)+(S.err?". Live connection unavailable ("+S.err+").":". Open the web version for live data."):"";
  if(S.source==="live"&&S.stale.length)src+=" Skipped due to stale BloFin data: "+S.stale.join(", ")+".";
  return'<p class="foot" style="margin:14px 0 0">'+src+' Indicators: EMA 5/9 (1m, 5m, 1D, 1W), EMA 9/21/50/200, RSI 14, MACD 12-26-9, VOL, KDJ 9-3-3, ROC 12, Williams %R 14, CCI 20, MFI 14, OBV, StochRSI 14, Bollinger 20-2, ATR 14. Automated technical analysis; not financial advice.</p>';
}

function render(){
  var ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&root.contains(ae))return;
  touchRefs();
  var hasA=Object.keys(S.A).length>0,ag=hasA?aggregate(S.mode,S.A):null,st=hasA?buildSetup(S.mode,S.A,ag):null,body;
  if(!hasA)body=noData();
  else if(S.tab==="resumen")body=resumen(ag,st);
  else if(S.tab==="matrix")body=matrix();
  else if(S.tab==="ind")body=indTab();
  else if(S.tab==="setups")body=setups();
  else if(S.tab==="fib")body=fibTab();
  else if(S.tab==="ew")body=ewTab();
  else body=book();
  root.innerHTML=head(ag)+tabsHTML()+'<div class="panel">'+body+'</div>'+footer();
}

root.addEventListener("click",function(e){
  var t=e.target.closest("[data-sym],[data-mode],[data-tab],[data-itf],[data-ftf],[data-etf],[data-rebase]");if(!t)return;
  try{var ae=document.activeElement;if(ae&&ae.tagName==="INPUT")ae.blur();}catch(_){}
  if(t.dataset.rebase){delete REFS[t.dataset.rebase];saveRefs();render();return;}
  if(t.dataset.ftf){S.ftf=t.dataset.ftf;render();return;}
  if(t.dataset.etf){S.etf=t.dataset.etf;render();return;}
  if(t.dataset.itf){S.itf=t.dataset.itf;render();return;}
  if(t.dataset.sym){if(t.dataset.sym!==S.sym)start(t.dataset.sym);return;}
  if(t.dataset.mode){S.mode=t.dataset.mode;LS.set("mtf.mode",S.mode);render();return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();}
});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible"||S.source!=="live")return;
  if(wsCtl)wsCtl.kick();
  loadLive(S.sym).then(function(){render();}).catch(function(){});
});
var busy=false,hbusy=false;function now0(){return Date.now();}
setInterval(function(){
  if(document.visibilityState!=="visible"||S.source!=="live"||busy)return;
  if(now0()-S.histAt>6e5&&!hbusy){hbusy=true;loadHist(S.sym,false).then(function(){hbusy=false;render();});}
  var now=Date.now(),per=S.mode==="SCALP"?6e4:3e5,roll=Math.floor((now-3000)/per)>Math.floor((S.loadedAt-3000)/per);
  if(!roll&&now-S.loadedAt<60000)return;
  busy=true;loadLive(S.sym).then(function(){busy=false;render();}).catch(function(){busy=false;});
},10000);

start("BTC");
})();
